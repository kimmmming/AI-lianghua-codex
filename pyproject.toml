[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core600"
version = "0.1.0"
description = "Reproducible and auditable A-share Core 600 candidate universe research project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "baostock>=0.8",
    "fastparquet>=2024.0",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
core600 = "core600.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
